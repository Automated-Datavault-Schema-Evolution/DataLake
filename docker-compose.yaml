services:
  ingestion-app:
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
    container_name: DataLakeHandler
    env_file: .env.docker
    volumes:
      - ./:/app
      - ${CHECKPOINT_PATH}:/tmp/delta/checkpoints
    networks:
      - data_automation-net
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
    restart: unless-stopped


networks:
  data_automation-net:
    external: true