services:
  datalake-ingestion-app:
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
    container_name: DataLakeIngestionHandler
    env_file:
      - .env
    volumes:
      - ./:/app
      - ${CHECKPOINT_PATH}:/tmp/delta/checkpoints
      - ${HOST_DATA_DIRECTORY}:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - delta-jars:/opt/delta-jars:ro
      - ext-jars:/opt/ext-jars:ro
      - jdbc-driver:/opt/jdbc-jars:ro
    networks:
      - data-automation-net
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092 #change hardcoded variable, to dynamic from env-file (currently hardcoded, as it would use localhost:9092 in docker)
      - ENV_TYPE=docker
      - CHECKPOINT_LOCATION=/tmp/delta/checkpoints
    restart: unless-stopped
    ports:
      - "4041:4041"
      - "50051:50051"
    depends_on:
      jdbc-driver-init:
        condition: service_completed_successfully
      delta-jars-init:
        condition: service_completed_successfully
      kafka-jars-init:
        condition: service_completed_successfully
      datalake-ingestion-spark-master:
        condition: service_healthy
      datalake-ingestion-spark-worker-1:
        condition: service_healthy
      datalake-ingestion-spark-worker-2:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.dl-app.rule=PathPrefix(`/spark/dl/app`)
      - traefik.http.services.dl-app.loadbalancer.server.port=4041
      - traefik.http.middlewares.dl-app-strip.stripprefix.prefixes=/spark/dl/app
      - traefik.http.routers.dl-app.middlewares=dl-app-strip

  datalake-ingestion-spark-master:
    image: apache/spark:3.5.6
    user: "0:0"
    container_name: datalake-ingestion-spark-master
    environment:
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
      - SPARK_CLASSPATH=/opt/delta-jars/*:/opt/ext-jars/*
      - UMASK=0002
      - SPARK_MASTER_OPTS=-Dspark.hadoop.fs.permissions.umask-mode=002
      - SPARK_NO_DAEMONIZE=1
      - SPARK_LOG_DIR=/tmp/spark/logs
      - SPARK_PID_DIR=/tmp/spark/pids
    command:
      - /bin/bash
      - -lc
      - >
        set -Eeuo pipefail;
        /opt/spark/sbin/start-master.sh
        -h datalake-ingestion-spark-master
        -p "${SPARK_MASTER_PORT:-7077}"
        --webui-port "${SPARK_MASTER_WEBUI_PORT:-8080}";
        tail -F /opt/spark/logs/* &
        wait -n
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - ${HOST_SPARK_SCRATCH}:${CONTAINER_SCRATCH_DIR}   # shuffle/tmp
      - delta-jars:/opt/delta-jars:ro
      - ext-jars:/opt/ext-jars:ro
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - data-automation-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080 && exec 3>&- 3<&- || exit 1'" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s


  datalake-ingestion-spark-worker-1:
    image: apache/spark:3.5.6
    user: "0:0"
    environment:
      - SPARK_WORKER_MEMORY=${SPARK_EXECUTOR_MEMORY}
      - SPARK_WORKER_CORES=${SPARK_EXECUTOR_CORES}
      - SPARK_WORKER_WEBUI_PORT=8081
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
      - SPARK_CLASSPATH=/opt/delta-jars/*:/opt/ext-jars/*
      - UMASK=0002
      - SPARK_WORKER_OPTS=-Dspark.hadoop.fs.permissions.umask-mode=002
      - SPARK_NO_DAEMONIZE=1
      - SPARK_LOG_DIR=/tmp/spark/logs
      - SPARK_PID_DIR=/tmp/spark/pids
    command:
      - /bin/bash
      - -lc
      - >
        set -Eeuo pipefail;
        /opt/spark/sbin/start-worker.sh
        --webui-port "${SPARK_WORKER_WEBUI_PORT:-8081}"
        -c "${SPARK_WORKER_CORES:-8}"
        -m "${SPARK_WORKER_MEMORY:-4g}"
        spark://datalake-ingestion-spark-master:7077;
        tail -F /opt/spark/logs/* &
        wait -n
    volumes:
      - ${HOST_SPARK_SCRATCH}:${CONTAINER_SCRATCH_DIR}   # shuffle/tmp
      - delta-jars:/opt/delta-jars:ro
      - ext-jars:/opt/ext-jars:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      datalake-ingestion-spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - data-automation-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8081 && exec 3>&- 3<&- || exit 1'" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  datalake-ingestion-spark-worker-2:
    image: apache/spark:3.5.6
    user: "0:0"
    environment:
      - SPARK_WORKER_MEMORY=${SPARK_EXECUTOR_MEMORY}
      - SPARK_WORKER_CORES=${SPARK_EXECUTOR_CORES}
      - SPARK_WORKER_WEBUI_PORT=8082
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
      - SPARK_CLASSPATH=/opt/delta-jars/*:/opt/ext-jars/*
      - UMASK=0002
      - SPARK_WORKER_OPTS=-Dspark.hadoop.fs.permissions.umask-mode=002
      - SPARK_NO_DAEMONIZE=1
      - SPARK_LOG_DIR=/tmp/spark/logs
      - SPARK_PID_DIR=/tmp/spark/pids
    command:
      - /bin/bash
      - -lc
      - >
        set -Eeuo pipefail;
        /opt/spark/sbin/start-worker.sh
        --webui-port "${SPARK_WORKER_WEBUI_PORT:-8082}"
        -c "${SPARK_WORKER_CORES:-8}"
        -m "${SPARK_WORKER_MEMORY:-4g}"
        spark://datalake-ingestion-spark-master:7077;
        tail -F /opt/spark/logs/* &
        wait -n
    volumes:
      - ${HOST_SPARK_SCRATCH}:${CONTAINER_SCRATCH_DIR}   # shuffle/tmp
      - delta-jars:/opt/delta-jars:ro
      - ext-jars:/opt/ext-jars:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      datalake-ingestion-spark-master:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks:
      - data-automation-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8082 && exec 3>&- 3<&- || exit 1'" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  jdbc-driver-init:
    image: curlimages/curl:8.10.1
    user: "0:0"
    entrypoint:
      - sh
      - -lc
      - >
        set -Eeuo pipefail; mkdir -p /out;
        curl -fL --retry 5 --retry-all-errors
        -o /out/postgresql-42.7.4.jar
        https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar;
        ls -l /out
    volumes:
      - jdbc-driver:/out
    networks:
      - data-automation-net

  delta-jars-init:
    image: curlimages/curl:8.10.1
    user: "0:0"
    entrypoint:
      - sh
      - -lc
      - |
        set -Eeuo pipefail
        mkdir -p /out
        echo "Downloading Delta jars to /out ..."
        curl -fL --retry 5 --retry-all-errors \
          -o /out/delta-spark_2.12-3.3.0.jar \
          https://repo1.maven.org/maven2/io/delta/delta-spark_2.12/3.3.0/delta-spark_2.12-3.3.0.jar
        curl -fL --retry 5 --retry-all-errors \
          -o /out/delta-storage-3.3.0.jar \
          https://repo1.maven.org/maven2/io/delta/delta-storage/3.3.0/delta-storage-3.3.0.jar
        ls -l /out
    volumes:
      - delta-jars:/out
    networks: [ data-automation-net ]

  kafka-jars-init:
    image: curlimages/curl:8.10.1
    user: "0:0"
    entrypoint:
      - sh
      - -lc
      - |
        set -Eeuo pipefail
        mkdir -p /out
        echo "Downloading Kafka connector jars to /out ..."
        curl -fL --retry 5 --retry-all-errors \
          -o /out/spark-sql-kafka-0-10_2.12-3.5.6.jar \
          https://repo1.maven.org/maven2/org/apache/spark/spark-sql-kafka-0-10_2.12/3.5.6/spark-sql-kafka-0-10_2.12-3.5.6.jar
        curl -fL --retry 5 --retry-all-errors \
          -o /out/spark-token-provider-kafka-0-10_2.12-3.5.6.jar \
          https://repo1.maven.org/maven2/org/apache/spark/spark-token-provider-kafka-0-10_2.12/3.5.6/spark-token-provider-kafka-0-10_2.12-3.5.6.jar
        curl -fL --retry 5 --retry-all-errors \
          -o /out/kafka-clients-3.5.1.jar \
          https://repo1.maven.org/maven2/org/apache/kafka/kafka-clients/3.5.1/kafka-clients-3.5.1.jar
        curl -fL --retry 5 --retry-all-errors \
          -o /out/commons-pool2-2.12.1.jar \
          https://repo1.maven.org/maven2/org/apache/commons/commons-pool2/2.12.1/commons-pool2-2.12.1.jar
        ls -l /out
    volumes:
      - ext-jars:/out
    networks: [ data-automation-net ]

volumes:
  ext-jars:
    external: true
  jdbc-driver:
    external: true
  delta-jars:
    external: true

networks:
  data-automation-net:
    external: true