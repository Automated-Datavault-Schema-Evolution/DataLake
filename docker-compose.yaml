services:
  ingestion-app:
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default
    container_name: DataLakeHandler
    env_file: .env.docker
    volumes:
      - ./:/app
      - ${CHECKPOINT_PATH}:/tmp/delta/checkpoints
      - ${HOST_DATA_DIRECTORY}:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - data_automation-net
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092 #change hardcoded variable, to dynamic from env-file (currently hardcoded, as it would use localhost:9092 in docker)
    restart: unless-stopped

  spark-master:
    image: ${SPARK_WORKER_IMAGE}
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    networks:
      - data_automation-net
    restart: unless-stopped

  spark-worker-1:
    image: ${SPARK_WORKER_IMAGE}
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8081
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    networks:
      - data_automation-net

  spark-worker-2:
    image: ${SPARK_WORKER_IMAGE}
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8082
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
    depends_on:
      - spark-master
    ports:
      - "8082:8082"
    networks:
      - data_automation-net

networks:
  data_automation-net:
    external: true